<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/glc%20red%20yel%20logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/glc%20red%20yel%20logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FF3C00" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gleenc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Gleenc - Buy & sell from any where</title>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          root.setAttribute("data-theme", "light");
          root.setAttribute("data-theme-preference", "light");
          root.classList.remove("dark");
          root.style.colorScheme = "light";
          localStorage.setItem("gleenc-theme", "light");
          localStorage.removeItem("gleank-theme");
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
